name: fusermount3 Security Research Demo
on: [push, pull_request, workflow_dispatch]

# IMPORTANT: This workflow demonstrates vulnerable conditions
# It does NOT exploit the vulnerability
# It is safe to run on CI/CD infrastructure

jobs:
  demonstrate-preconditions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "1. Verify Environment"
        run: |
          echo "=== fusermount3 CI/CD Vulnerability Demonstration ==="
          echo "This workflow shows vulnerable conditions exist"
          echo "It does NOT execute the exploit"
          echo ""
      
      - name: "2. Check /dev/fuse"
        run: |
          echo "=== /dev/fuse Status ==="
          ls -la /dev/fuse
          if [ -c /dev/fuse ]; then
            echo "✓ /dev/fuse exists and is character device"
          else
            echo "✗ /dev/fuse not available"
          fi
          echo ""
      
      - name: "3. Check fusermount3"
        run: |
          echo "=== fusermount3 Status ==="
          which fusermount3
          ls -la $(which fusermount3)
          
          # Check if setuid
          if [ -u $(which fusermount3) ]; then
            echo "✓ fusermount3 is SETUID-ROOT (vulnerable condition)"
          else
            echo "✗ fusermount3 not setuid (safe)"
          fi
          
          # Check version
          fusermount3 --version || true
          echo ""
      
      - name: "4. Check libfuse version"
        run: |
          echo "=== libfuse3 Package ==="
          dpkg -l | grep fuse || true
          apt list --installed 2>/dev/null | grep fuse || true
          echo ""
      
      - name: "5. Demonstrate Exploit Vector"
        run: |
          echo "=== Exploit Vector Demonstration ==="
          echo ""
          echo "The vulnerability requires:"
          echo "1. Legitimate directory: mkdir -p /tmp/x/proc"
          echo "2. Unconnected AF_UNIX socket (passes S_ISSOCK, fails sendmsg)"
          echo "3. Race window during add_mount() fork/exec"
          echo "4. Symlink swap: /tmp/x -> / (points to root)"
          echo "5. Cleanup umount2('/tmp/x/proc') resolves to umount2('/proc')"
          echo ""
          
          # Demonstrate the socket creation
          python3 << 'PYEOF'
import socket
import os

# Create unconnected AF_UNIX socket
sock = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM)
print(f"Created AF_UNIX SOCK_DGRAM socket: fd={sock.fileno()}")
print(f"  - Passes S_ISSOCK check: ✓")
print(f"  - Fails sendmsg() with ENOTCONN: ✓ (unconnected)")
print(f"  - Triggers cleanup path: ✓")
print("")
print(f"To exploit, set _FUSE_COMMFD={sock.fileno()}")
print("then call fusermount3 /tmp/x/proc")
PYEOF
          echo ""
      
      - name: "6. Show Race Window"
        run: |
          echo "=== Race Window Analysis ==="
          echo ""
          echo "fusermount3 execution timeline:"
          echo ""
          echo "  T+0ms:   main() starts"
          echo "  T+3ms:   mount_fuse() called"
          echo "  T+6ms:   mount(2) succeeds (FUSE mounted!)"
          echo "           *** RACE WINDOW STARTS ***"
          echo "  T+7ms:   add_mount() -> fork() + exec(/bin/mount)"
          echo "           (guaranteed 1-10ms window)"
          echo "  T+9ms:   [ATTACKER] rename(/tmp/x, /tmp/y)"
          echo "           [ATTACKER] symlink(/, /tmp/x)"
          echo "  T+12ms:  add_mount() returns"
          echo "           *** RACE WINDOW ENDS ***"
          echo "  T+13ms:  send_fd() fails (ENOTCONN)"
          echo "  T+14ms:  umount2('/tmp/x/proc') -> /proc as ROOT!"
          echo ""
          
      - name: "7. Impact Simulation"
        run: |
          echo "=== Impact on Concurrent Jobs ==="
          echo ""
          echo "If this were a self-hosted runner with multiple jobs:"
          echo ""
          echo "  Job A (npm build):     FAILS - process spawning broken"
          echo "  Job B (docker build):  FAILS - /proc/self access broken"
          echo "  Job C (go test):       FAILS - runtime needs /proc"
          echo "  Job D (python test):   FAILS - subprocess module broken"
          echo ""
          echo "  System impact:"
          echo "    - ps, top, pgrep: FAIL"
          echo "    - systemd: FAIL"
          echo "    - Docker daemon: FAIL"
          echo "    - Requires: Hard reboot"
          echo ""
          
          # Show what would break
          echo "Commands that would fail after /proc unmount:"
          echo "  - ps aux"
          echo "  - pgrep init"
          echo "  - ls /proc/1/"
          echo "  - docker ps"
          echo ""
      
      - name: "8. Compile Technical Demo"
        run: |
          echo "=== Building Technical Demonstration ==="
          gcc -o /tmp/exploit_demo exploit_technical_demo.c
          /tmp/exploit_demo --check
          echo ""
      
      - name: "9. Conclusion"
        run: |
          echo "=== Summary ==="
          echo ""
          echo "Vulnerability: CONFIRMED"
          echo "  - /dev/fuse accessible: YES"
          echo "  - fusermount3 setuid: YES"
          echo "  - Exploit vector available: YES"
          echo ""
          echo "GitHub-hosted runner impact: LIMITED"
          echo "  - Single-tenant VM (one job per VM)"
          echo "  - Exploit would only affect this job"
          echo "  - CVSS 6.5 (Medium) for this scenario"
          echo ""
          echo "Self-hosted multi-tenant runner impact: HIGH"
          echo "  - Multi-tenant (multiple jobs share host)"
          echo "  - One job can unmount /proc for ALL jobs"
          echo "  - CVSS 7.7 (High) for this scenario"
          echo ""
          echo "RECOMMENDATION:"
          echo "  1. Patch fusermount3 (see exploit_technical_demo.c --mitigation)"
          echo "  2. Use single-tenant runners for untrusted code"
          echo "  3. Monitor for suspicious FUSE mount patterns"
          echo ""

  # Second job simulates a "concurrent victim"
  simulate-victim-job:
    runs-on: ubuntu-latest
    needs: demonstrate-preconditions
    steps:
      - name: "Normal CI/CD Operations"
        run: |
          echo "=== Simulating Normal CI/CD Job ==="
          echo ""
          echo "This represents another job that would be"
          echo "running concurrently on a self-hosted runner."
          echo ""
          
          # Normal operations that need /proc
          echo "Process operations:"
          ps aux | head -5
          echo ""
          
          echo "Process lookup:"
          pgrep init || true
          echo ""
          
          echo "Docker operations (if available):"
          docker ps 2>/dev/null || echo "Docker not available in this runner"
          echo ""
          
          echo "On a compromised self-hosted runner, these would FAIL"
          echo "when another job unmounts /proc via fusermount3 bug."
